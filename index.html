<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق أنس لأوقات المغرب والصين</title>
  <style>
    body {
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      direction: rtl;
      position: relative;
      box-sizing: border-box;
      padding: 90px 20px 40px;
      overflow-x: hidden;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* === زخارف الخلفية === */
    .bg-decorations {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; overflow: hidden;
      z-index: 1; pointer-events: none;
    }
    .orb {
      position: absolute; border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(5px);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
      animation: float 20s infinite ease-in-out;
    }
    .orb-1 { width: 300px; height: 300px; top: -50px; left: -50px; animation-duration: 18s; }
    .orb-2 { width: 200px; height: 200px; bottom: 50px; right: -30px; animation-duration: 22s; animation-delay: -5s; }
    .orb-3 { width: 150px; height: 150px; top: 40%; left: 15%; animation-duration: 15s; animation-delay: -2s; }
    .orb-4 { width: 250px; height: 250px; bottom: -80px; left: 30%; animation-duration: 25s; animation-delay: -10s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-30px) rotate(180deg) scale(1.1); }
    }
    
    .main-title {
      position: absolute; top: 20px; left: 0; right: 0; margin: 0 auto;
      color: white; font-size: 2rem; text-align: center;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); width: 100%; z-index: 2;
    }

    .container {
      display: flex; flex-direction: column; align-items: center; gap: 25px;
      z-index: 2; width: 100%; max-width: 700px;
    }

    .clock-container { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; width: 100%; }
    
    .clock-card, .converter-card {
      background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px);
      border-radius: 20px; text-align: center; color: white;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2); border: 1px solid rgba(255, 255, 255, 0.25);
      transition: transform 0.3s ease;
    }
    .clock-card { padding: 20px 35px; flex: 1; min-width: 220px; }
    .clock-card:hover, .converter-card:hover { transform: translateY(-3px); }
    
    .clock-card h2 { margin: 0 0 10px 0; font-size: 1.6rem; }
    .temp-badge {
      display: inline-block; background: rgba(0, 0, 0, 0.25);
      padding: 4px 12px; border-radius: 12px; font-size: 0.95rem; margin-bottom: 10px;
    }
    .time { font-size: 2.6rem; font-weight: bold; margin-bottom: 5px; }
    .date { font-size: 1rem; opacity: 0.85; margin-bottom: 15px; }
    
    .pop-section {
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      padding-top: 10px; margin-top: 10px;
    }
    .pop-label { font-size: 0.85rem; opacity: 0.9; margin-bottom: 4px; }
    .pop-count { font-size: 1.2rem; font-weight: bold; }

    /* === بطاقة محول العملات === */
    .converter-card { width: 100%; padding: 20px 30px; box-sizing: border-box; }
    .converter-card h3 { margin: 0 0 15px 0; font-size: 1.3rem; }
    
    .converter-grid {
      display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap;
    }
    .input-group {
      display: flex; flex-direction: column; align-items: flex-start; gap: 5px; flex: 1; min-width: 140px;
    }
    .input-group label { font-size: 0.85rem; opacity: 0.9; }
    .input-group input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.2); color: white;
      font-size: 1.1rem; font-weight: bold; box-sizing: border-box; outline: none;
    }
    .input-group input:focus { border-color: white; background: rgba(0, 0, 0, 0.3); }
    .exchange-icon { font-size: 1.5rem; margin-top: 18px; }
    .rate-info { font-size: 0.8rem; opacity: 0.8; margin-top: 12px; }

    /* === زر نسخ الرابط المباشر في زاوية الشاشة === */
    .copy-link-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 10px 18px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      direction: ltr;
    }
    .copy-link-btn:hover {
      background: rgba(0, 0, 0, 0.6);
      transform: scale(1.05);
    }
    .copy-link-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="bg-decorations">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>
  
  <h1 class="main-title">تطبيق أَنَس لأوقات المغرب والصين</h1>

  <div class="container">
    <div class="clock-container">
      <!-- فاس -->
      <div class="clock-card">
        <h2>فاس 🇲🇦</h2>
        <div id="fez-temp" class="temp-badge">جاري الجلب...</div>
        <div id="fez-time" class="time">00:00:00</div>
        <div id="fez-date" class="date">--/--/----</div>
        <div class="pop-section">
          <div class="pop-label">عدد سكان المغرب (مباشر)</div>
          <div id="morocco-pop" class="pop-count">--</div>
        </div>
      </div>

      <!-- هانزونغ -->
      <div class="clock-card">
        <h2>هانزونغ 🇨🇳</h2>
        <div id="hanzhong-temp" class="temp-badge">جاري الجلب...</div>
        <div id="hanzhong-time" class="time">00:00:00</div>
        <div id="hanzhong-date" class="date">--/--/----</div>
        <div class="pop-section">
          <div class="pop-label">عدد سكان الصين (مباشر)</div>
          <div id="china-pop" class="pop-count">--</div>
        </div>
      </div>
    </div>

    <!-- محول العملات -->
    <div class="converter-card">
      <h3>💱 محول العملات المباشر</h3>
      <div class="converter-grid">
        <div class="input-group">
          <label for="mad-input">الدرهم المغربي (MAD)</label>
          <input type="number" id="mad-input" placeholder="0" value="100">
        </div>
        <div class="exchange-icon">⇄</div>
        <div class="input-group">
          <label for="cny-input">اليوان الصيني (CNY)</label>
          <input type="number" id="cny-input" placeholder="0">
        </div>
      </div>
      <div class="rate-info" id="rate-info">جاري جلب سعر الصرف...</div>
    </div>
  </div>

  <!-- زر نسخ الرابط في زاوية الشاشة -->
  <button class="copy-link-btn" id="copyBtn" onclick="copyPageUrl()">
    <span>🔗</span>
    <span id="btnText">نسخ رابط الصفحة</span>
  </button>

  <script>
    // 1. الوقت والتاريخ
    function updateClocks() {
      const now = new Date();
      document.getElementById('fez-time').textContent = now.toLocaleTimeString('en-US', { timeZone: 'Africa/Casablanca', hour12: false });
      document.getElementById('fez-date').textContent = now.toLocaleDateString('en-US', { timeZone: 'Africa/Casablanca', year: 'numeric', month: 'numeric', day: 'numeric' });
      document.getElementById('hanzhong-time').textContent = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Shanghai', hour12: false });
      document.getElementById('hanzhong-date').textContent = now.toLocaleDateString('en-US', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'numeric', day: 'numeric' });
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // 2. الطقس
    async function fetchWeather() {
      try {
        const fezRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.0333&longitude=-5.0000&current_weather=true');
        const fezData = await fezRes.json();
        document.getElementById('fez-temp').textContent = `🌡️ ${fezData.current_weather.temperature}°C`;

        const hanRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=33.0728&longitude=107.0303&current_weather=true');
        const hanData = await hanRes.json();
        document.getElementById('hanzhong-temp').textContent = `🌡️ ${hanData.current_weather.temperature}°C`;
      } catch (err) {
        document.getElementById('fez-temp').textContent = '🌡️ -- °C';
        document.getElementById('hanzhong-temp').textContent = '🌡️ -- °C';
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);

    // 3. عدد السكان
    let moroccoPop = 38000000;
    let chinaPop = 1411750000;
    function updatePopulation() {
      if (Math.random() > 0.6) moroccoPop += 1;
      if (Math.random() > 0.3) chinaPop += Math.floor(Math.random() * 2);
      document.getElementById('morocco-pop').textContent = moroccoPop.toLocaleString('en-US');
      document.getElementById('china-pop').textContent = chinaPop.toLocaleString('en-US');
    }
    setInterval(updatePopulation, 3000);
    updatePopulation();

    // 4. محول العملات
    let madToCnyRate = 0.72;
    async function fetchExchangeRate() {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/MAD');
        const data = await res.json();
        if (data && data.rates && data.rates.CNY) {
          madToCnyRate = data.rates.CNY;
          document.getElementById('rate-info').textContent = `1 درهم مغربي = ${madToCnyRate.toFixed(4)} يوان صيني (يتحدث كل 12 ساعة)`;
          convertMADtoCNY();
        }
      } catch (err) {
        document.getElementById('rate-info').textContent = `سعر الصرف التقديري: 1 MAD ≈ ${madToCnyRate} CNY`;
      }
    }

    const madInput = document.getElementById('mad-input');
    const cnyInput = document.getElementById('cny-input');

    function convertMADtoCNY() {
      const madVal = parseFloat(madInput.value);
      if (isNaN(madVal)) { cnyInput.value = ''; return; }
      cnyInput.value = (madVal * madToCnyRate).toFixed(2);
    }

    function convertCNYtoMAD() {
      const cnyVal = parseFloat(cnyInput.value);
      if (isNaN(cnyVal)) { madInput.value = ''; return; }
      madInput.value = (cnyVal / madToCnyRate).toFixed(2);
    }

    madInput.addEventListener('input', convertMADtoCNY);
    cnyInput.addEventListener('input', convertCNYtoMAD);
    fetchExchangeRate();
    setInterval(fetchExchangeRate, 12 * 60 * 60 * 1000);

    // 5. وظيفة نسخ رابط الصفحة
    function copyPageUrl() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const btnText = document.getElementById('btnText');
        btnText.textContent = 'تم النسخ بنجاح! ✓';
        setTimeout(() => {
          btnText.textContent = 'نسخ رابط الصفحة';
        }, 2000);
      });
    }
  </script>
</body>
</html>
