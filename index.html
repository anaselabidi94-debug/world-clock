<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تطبيق أنس لأوقات المغرب والصين</title>
  <style>
    body {
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      direction: rtl;
      position: relative;
      box-sizing: border-box;
      padding-top: 80px;
      overflow: hidden; /* لمنع ظهور شريط التمرير عند تحرك الزخارف */
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* === زخارف الخلفية (Background Orbs) === */
    .bg-decorations {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      z-index: 1;
      pointer-events: none;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(5px);
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
      animation: float 20s infinite ease-in-out;
    }
    .orb-1 { width: 300px; height: 300px; top: -50px; left: -50px; animation-duration: 18s; }
    .orb-2 { width: 200px; height: 200px; bottom: 50px; right: -30px; animation-duration: 22s; animation-delay: -5s; }
    .orb-3 { width: 150px; height: 150px; top: 40%; left: 15%; animation-duration: 15s; animation-delay: -2s; }
    .orb-4 { width: 250px; height: 250px; bottom: -80px; left: 30%; animation-duration: 25s; animation-delay: -10s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      50% { transform: translateY(-30px) rotate(180deg) scale(1.1); }
    }
    
    /* === المحتوى الرئيسي === */
    .main-title {
      position: absolute;
      top: 25px;
      left: 0; right: 0;
      margin: 0 auto;
      color: white;
      font-size: 2.2rem;
      text-align: center;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      width: 100%;
      z-index: 2;
    }

    .clock-container { 
      display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; margin-top: 20px; 
      z-index: 2;
    }
    
    .clock-card {
      background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(12px);
      padding: 25px 40px; border-radius: 20px; text-align: center; color: white; min-width: 250px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2); border: 1px solid rgba(255, 255, 255, 0.25);
      transition: transform 0.3s ease;
    }
    .clock-card:hover {
      transform: translateY(-5px);
    }
    
    .clock-card h2 { margin: 0 0 10px 0; font-size: 1.8rem; }
    
    .temp-badge {
      display: inline-block;
      background: rgba(0, 0, 0, 0.25);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    
    .time { font-size: 2.8rem; font-weight: bold; margin-bottom: 5px; }
    .date { font-size: 1.1rem; opacity: 0.85; margin-bottom: 15px; }
    
    .pop-section {
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      padding-top: 10px;
      margin-top: 10px;
    }
    
    .pop-label { font-size: 0.85rem; opacity: 0.9; margin-bottom: 4px; }
    .pop-count { font-size: 1.3rem; font-weight: bold; color: #fff; }
  </style>
</head>
<body>

  <!-- زخارف الخلفية المضافة -->
  <div class="bg-decorations">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>
  
  <h1 class="main-title">تطبيق أَنَس لأوقات المغرب والصين</h1>

  <div class="clock-container">
    <!-- بطاقة فاس (المغرب) -->
    <div class="clock-card">
      <h2>فاس 🇲🇦</h2>
      <div id="fez-temp" class="temp-badge">جاري جلب الطقس...</div>
      <div id="fez-time" class="time">00:00:00</div>
      <div id="fez-date" class="date">--/--/----</div>
      
      <div class="pop-section">
        <div class="pop-label">عدد سكان المغرب (مباشر)</div>
        <div id="morocco-pop" class="pop-count">--</div>
      </div>
    </div>

    <!-- بطاقة هانزونغ (الصين) -->
    <div class="clock-card">
      <h2>هانزونغ 🇨🇳</h2>
      <div id="hanzhong-temp" class="temp-badge">جاري جلب الطقس...</div>
      <div id="hanzhong-time" class="time">00:00:00</div>
      <div id="hanzhong-date" class="date">--/--/----</div>
      
      <div class="pop-section">
        <div class="pop-label">عدد سكان الصين (مباشر)</div>
        <div id="china-pop" class="pop-count">--</div>
      </div>
    </div>
  </div>

  <script>
    // 1. تحديث الوقت والتاريخ بالأرقام 123456
    function updateClocks() {
      const now = new Date();
      
      const fezTimeStr = now.toLocaleTimeString('en-US', { timeZone: 'Africa/Casablanca', hour12: false });
      const fezDateStr = now.toLocaleDateString('en-US', { timeZone: 'Africa/Casablanca', year: 'numeric', month: 'numeric', day: 'numeric' });
      
      const hanzhongTimeStr = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Shanghai', hour12: false });
      const hanzhongDateStr = now.toLocaleDateString('en-US', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'numeric', day: 'numeric' });
      
      document.getElementById('fez-time').textContent = fezTimeStr;
      document.getElementById('fez-date').textContent = fezDateStr;
      document.getElementById('hanzhong-time').textContent = hanzhongTimeStr;
      document.getElementById('hanzhong-date').textContent = hanzhongDateStr;
    }
    setInterval(updateClocks, 1000);
    updateClocks();

    // 2. جلب درجة الحرارة الفعلية المباشرة (Open-Meteo API)
    async function fetchWeather() {
      try {
        const fezRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.0333&longitude=-5.0000&current_weather=true');
        const fezData = await fezRes.json();
        document.getElementById('fez-temp').textContent = `🌡️ ${fezData.current_weather.temperature}°C`;

        const hanRes = await fetch('https://api.open-meteo.com/v1/forecast?latitude=33.0728&longitude=107.0303&current_weather=true');
        const hanData = await hanRes.json();
        document.getElementById('hanzhong-temp').textContent = `🌡️ ${hanData.current_weather.temperature}°C`;
      } catch (err) {
        document.getElementById('fez-temp').textContent = '🌡️ -- °C';
        document.getElementById('hanzhong-temp').textContent = '🌡️ -- °C';
      }
    }
    fetchWeather();
    setInterval(fetchWeather, 600000);

    // 3. عداد السكان المباشر
    let moroccoPop = 38000000;
    let chinaPop = 1411750000;

    function updatePopulation() {
      if (Math.random() > 0.6) moroccoPop += 1;
      if (Math.random() > 0.3) chinaPop += Math.floor(Math.random() * 2);

      document.getElementById('morocco-pop').textContent = moroccoPop.toLocaleString('en-US');
      document.getElementById('china-pop').textContent = chinaPop.toLocaleString('en-US');
    }
    setInterval(updatePopulation, 3000);
    updatePopulation();
  </script>
</body>
</html>
