<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرفة اوقات العالم والعملات</title>
  <style>
    body {
      margin: 0; padding: 0; min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      direction: rtl;
      gap: 20px;
      padding: 20px 0;
      box-sizing: border-box;
    }
    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    h1 {
      color: white; text-align: center; margin: 0; font-size: 2.2rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .clock-container { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
    .clock-card {
      background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
      padding: 30px 50px; border-radius: 20px; text-align: center; color: white; min-width: 200px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2); border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .clock-card h2 { margin: 0 0 10px 0; font-size: 1.8rem; }
    .time { font-size: 3rem; font-weight: bold; margin-bottom: 5px; }
    .date { font-size: 1.1rem; opacity: 0.8; }
    
    /* تصميم بطاقات العدادات والعملات */
    .info-container {
      display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px;
    }
    .info-card {
      background: rgba(0, 0, 0, 0.25); backdrop-filter: blur(10px);
      padding: 20px 30px; border-radius: 20px; text-align: center; color: white;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.1);
      flex: 1; min-width: 280px;
    }
    .info-card h3 { margin: 0 0 10px 0; font-size: 1.3rem; color: #ffeb3b; }
    .counter-val { font-size: 2.2rem; font-weight: bold; font-family: monospace; }
    .update-time { font-size: 0.85rem; opacity: 0.6; margin-top: 5px; }
  </style>
</head>
<body>

  <h1>مرحباً بكم في موقع معرفة الأوقات الخاص بي ✨</h1>

  <!-- قسم الساعات -->
  <div class="clock-container">
    <div class="clock-card">
      <h2>المغرب 🇲🇦</h2>
      <div id="morocco-time" class="time">00:00:00</div>
      <div id="morocco-date" class="date">--/--/----</div>
    </div>
    <div class="clock-card">
      <h2>بكين 🇨🇳</h2>
      <div id="china-time" class="time">00:00:00</div>
      <div id="china-date" class="date">--/--/----</div>
    </div>
  </div>

  <!-- قسم العدادات الإضافية والعملة -->
  <div class="info-container">
    <!-- بطاقة عداد السكان -->
    <div class="info-card">
      <h3>👥 عداد سكان الصين المباشر</h3>
      <div id="china-population" class="counter-val">1,412,262,052</div>
      <div class="update-time">تحديث فوري مستمر</div>
    </div>

    <!-- بطاقة أسعار الصرف اللحظية -->
    <div class="info-card">
      <h3>💱 أسعار الصرف المباشرة (MAD / CNY)</h3>
      <div id="exchange-rate-box" class="counter-val" style="font-size: 1.6rem; line-height: 1.6;">
        1 د.م 🇲🇦 = <span id="mad-to-cny" style="color: #23d5ab;">--</span> يوان 🇨🇳<br>
        1 يوان 🇨🇳 = <span id="cny-to-mad" style="color: #ee7752;">--</span> د.م 🇲🇦
      </div>
      <div id="rate-update-status" class="update-time">جاري جلب الأسعار اللحظية...</div>
    </div>
  </div>

  <script>
    // إعدادات العداد السكاني المرجعية
    const basePopulation = 1412262052; 
    const baseTime = new Date("2026-09-10T13:00:00").getTime();

    // دالة لجلب أسعار العملات مباشرة وحية وتحديثها تلقائياً عند تغيير الثمن
    async function fetchLiveExchangeRate() {
      try {
        const response = await fetch("https://er-api.com");
        if (!response.ok) throw new Error();
        const data = await response.json();
        
        // جلب قيمة اليوان الصيني مقابل الدرهم
        const madToCnyRate = data.rates.CNY;
        const cnyToMadRate = (1 / madToCnyRate);

        // إدراج القيم في الموقع وتدوير الأرقام لأقرب 3 خانات دقيقة
        document.getElementById('mad-to-cny').textContent = madToCnyRate.toFixed(3);
        document.getElementById('cny-to-mad').textContent = cnyToMadRate.toFixed(3);
        
        const now = new Date();
        document.getElementById('rate-update-status').textContent = "تحديث حي وتلقائي فور تغير الأسعار: " + now.toLocaleTimeString('ar-MA', {hour: '2-digit', minute:'2-digit'});
      } catch (error) {
        // قيم احتياطية في حال انقطاع اتصال الزائر بالإنترنت
        document.getElementById('mad-to-cny').textContent = "0.715";
        document.getElementById('cny-to-mad').textContent = "1.395";
        document.getElementById('rate-update-status').textContent = "تحديث تقريبي (الاتصال بالشبكة ضعيف)";
      }
    }

    function updateClocksAndPop() {
      const now = new Date();
      
      // توقيت المغرب
      const moroccoTimeStr = now.toLocaleTimeString('en-US', { timeZone: 'Africa/Casablanca', hour12: false });
      const moroccoDateStr = now.toLocaleDateString('ar-MA', { timeZone: 'Africa/Casablanca', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('morocco-time').textContent = moroccoTimeStr;
      document.getElementById('morocco-date').textContent = moroccoDateStr;

      // توقيت بكين
      const chinaTimeStr = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Shanghai', hour12: false });
      const chinaDateStr = now.toLocaleDateString('ar-EG', { timeZone: 'Asia/Shanghai', year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('china-time').textContent = chinaTimeStr;
      document.getElementById('china-date').textContent = chinaDateStr;

      // تحديث عداد السكان اللحظي
      const elapsedSeconds = Math.floor((now.getTime() - baseTime) / 1000);
      const currentPop = basePopulation + Math.floor(elapsedSeconds * 0.2); 
      document.getElementById('china-population').textContent = currentPop.toLocaleString('en-US');
    }

    // تشغيل العدادات كل ثانية
    setInterval(updateClocksAndPop, 1000);
    updateClocksAndPop();

    // جلب العملات بشكل حي وفوري، وإعادة تحديثها تلقائياً بالخلفية كل ساعة لضمان المواكبة مع البورصة العالمية
    fetchLiveExchangeRate();
    setInterval(fetchLiveExchangeRate, 3600000); 
  </script>
</body>
</html>
